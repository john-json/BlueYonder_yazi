# Temporary standalone dark theme.
# Flavors are disabled to isolate the appearance from the earlier patches.

[flavor]
dark = ""
light = ""

[app]
overall = {}

[mgr]
cwd = { fg = "#c6c6c8", bold = false }
border_symbol = "│"
border_style = { fg = "#48484a" }

[indicator]
parent = { fg = "#a4b9c6", reversed = false }
current = { fg = "#a4b9c6", bg = "#3a3a3c", reversed = false, bold = false }
preview = { fg = "#c6c6c8", bg = "#3a3a3c", reversed = false, underline = false }
padding = { open = "", close = "" }

[tabs]
active = { fg = "#a4b9c6", bg = "#3a3a3c", bold = true }
inactive = { fg = "#a1a1a6", bg = "#2b2b2d" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#a4b9c6", bg = "#3a3a3c", bold = true }
normal_alt = { fg = "#b8b8bd", bg = "#2b2b2d" }
select_main = { fg = "#a4b9c6", bg = "#3a3a3c", bold = true }
select_alt = { fg = "#b8b8bd", bg = "#2b2b2d" }
unset_main = { fg = "#a4b9c6", bg = "#b63d43", bold = true }
unset_alt = { fg = "#c6c6c8", bg = "#2b2b2d" }

[status]
overall = { fg = "#c6c6c8" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_type = { fg = "#a1a1a6" }
perm_read = { fg = "#a1a1a6" }
perm_write = { fg = "#a1a1a6" }
perm_exec = { fg = "#a1a1a6" }
perm_sep = { fg = "#77777d" }
progress_label = { fg = "#c6c6c8", bold = false }
progress_normal = { fg = "#3a3a3c", bg = "#2b2b2d" }
progress_error = { fg = "#ff6961", bg = "#2b2b2d" }

[filetype]
rules = [
    { url = "*/", fg = "#c6c6c8", bold = true },
    { url = "*", fg = "#c6c6c8", bold = false },
]

[icon]
globs = []
dirs = []
files = []
exts = []
conds = [
    { if = "dir", text = "󰉋", fg = "#a4b9c6" },
    { if = "link", text = "", fg = "#a4b9c6" },
    { if = "!dir", text = "", fg = "#a4b9c6" },
]
